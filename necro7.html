<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cena - A última dança de Graxis</title>
    <style>
        body { margin: 0; background: black; overflow: hidden; font-family: 'Georgia', serif; }
        
        .bg-image {
            width: 100vw; height: 100vh;
            background-image: url("imagens/graxis.png");
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            position: absolute;
            z-index: 1;
        }

        .back-btn {
            position: absolute; top: 20px; left: 20px;
            color: white; text-decoration: none; background: rgba(0,0,0,0.5);
            padding: 10px; border-radius: 5px;
            z-index: 10;
        }

        /* Container de Miniaturas Laterais (Direita) */
        .video-shortcuts {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 10;
        }

        .video-thumb-box {
            width: 160px;
            height: 90px;
            border: 2px solid #c5a059;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            background: #000;
            box-shadow: 0 0 15px rgba(0,0,0,0.7);
            transition: transform 0.3s, border-color 0.3s;
            position: relative;
        }

        .video-thumb-box:hover {
            transform: scale(1.05);
            border-color: #ffffff;
        }

        .video-thumb-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none; /* Evita que o clique caia nos controles nativos do mini video */
        }

        /* Label discreta acima da miniatura */
        .video-label {
            position: absolute;
            bottom: 2px;
            left: 0;
            width: 100%;
            background: rgba(0,0,0,0.6);
            color: #c5a059;
            font-size: 0.75em;
            text-align: center;
            padding: 2px 0;
        }

        /* Modal para Maximizar o Vídeo */
        #video-modal {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 30;
        }

        #modal-video-player {
            max-width: 90%;
            max-height: 85%;
            box-shadow: 0 0 30px rgba(197, 160, 89, 0.3);
            border: 1px solid #c5a059;
        }

        .close-modal-btn {
            position: absolute;
            top: 30px;
            right: 40px;
            color: #c5a059;
            font-size: 2em;
            cursor: pointer;
            background: none;
            border: none;
            transition: color 0.2s;
        }

        .close-modal-btn:hover {
            color: white;
        }

        /* Tela de Início */
        #play-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            transition: opacity 0.5s ease;
        }

        .btn-iniciar {
            padding: 20px 40px;
            font-size: 1.5em;
            color: #c5a059;
            background: #1a1a1a;
            border: 2px solid #c5a059;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(197, 160, 89, 0.5);
            transition: 0.3s;
        }

        .btn-iniciar:hover {
            background: #c5a059;
            color: #1a1a1a;
        }

        /* Barra de Controle de Áudio Customizada */
        .audio-player-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
            background: rgba(26, 26, 26, 0.9);
            padding: 10px 20px;
            border-radius: 50px;
            border: 1px solid #c5a059;
            display: none;
            align-items: center;
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
        }

        audio {
            height: 30px;
            filter: sepia(100%) hue-rotate(10deg) saturate(200%) brightness(80%);
        }
    </style>
</head>
<body>

    <a href="Odisseia.html" class="back-btn">⬅ Voltar</a>
    
    <div id="play-screen">
        <button class="btn-iniciar" onclick="iniciarCena()">💀 Enfim, meu fim...</button>
    </div>

    <div class="video-shortcuts">
        <div class="video-thumb-box" onclick="maximizarVideo('imagens/Graxis_heal.mp4')">
            <video src="imagens/Graxis_heal.mp4" muted preload="metadata"></video>
            <div class="video-label">Graxis Forte</div>
        </div>
        <div class="video-thumb-box" onclick="maximizarVideo('imagens/Graxis_faz.mp4')">
            <video src="imagens/Graxis_faz.mp4" muted preload="metadata"></video>
            <div class="video-label">Nero Graxis</div>
        </div>
    </div>

    <div id="video-modal">
        <button class="close-modal-btn" onclick="fecharVideo()">✕</button>
        <video id="modal-video-player" controls></video>
    </div>

    <div class="bg-image"></div>

    <div class="audio-player-container" id="controls">
        <audio id="musicaLocal" controls loop>
            <source src="sons/Nero Forte Classic.mp3" type="audio/mpeg">
            Seu navegador não suporta áudio.
        </audio>
    </div>

    <script>
        const audio = document.getElementById('musicaLocal');
        const modal = document.getElementById('video-modal');
        const modalVideo = document.getElementById('modal-video-player');

        function iniciarCena() {
            const screen = document.getElementById('play-screen');
            const controls = document.getElementById('controls');
            
            // Inicia o áudio local
            audio.play().catch(e => console.log("Erro ao tocar:", e));
            
            // Mostra os controles e remove a tela de início
            controls.style.display = 'flex';
            screen.style.opacity = '0';
            setTimeout(() => {
                screen.style.display = 'none';
            }, 500);
        }

        // Função para abrir e dar play no vídeo maximizado
        function maximizarVideo(caminhoVideo) {
            modalVideo.src = caminhoVideo;
            modal.style.display = 'flex';
            modalVideo.play().catch(e => console.log("Erro ao reproduzir vídeo:", e));
        }

        // Função para fechar o vídeo e limpar o player do modal
        function fecharVideo() {
            modalVideo.pause();
            modalVideo.src = ""; // Limpa a origem para parar o carregamento do vídeo de vez
            modal.style.display = 'none';
        }

        // Se o vídeo chegar ao fim sozinho, ele fecha o modal automaticamente
        modalVideo.addEventListener('ended', function() {
            fecharVideo();
        });

        // Loop Infinito Reforçado via Script para a música de fundo
        audio.addEventListener('ended', function() {
            this.currentTime = 0;
            this.play();
        }, false);
    </script>
</body>
</html>
