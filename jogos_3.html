<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cena - Os Atletas</title>
    <style>
        body { margin: 0; background: black; overflow: hidden; font-family: 'Georgia', serif; }
        
        /* Estilização do Vídeo de Fundo */
        .bg-video {
            width: 100vw; 
            height: 100vh;
            object-fit: contain; /* Mantém a proporção do vídeo centralizado */
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .back-btn {
            position: absolute; top: 20px; left: 20px;
            color: white; text-decoration: none; background: rgba(0,0,0,0.5);
            padding: 10px; border-radius: 5px;
            z-index: 10;
        }

        /* Tela de Início */
        #play-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            transition: opacity 0.5s ease;
        }

        .btn-iniciar {
            padding: 20px 40px;
            font-size: 1.5em;
            color: #c5a059;
            background: #1a1a1a;
            border: 2px solid #c5a059;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(197, 160, 89, 0.5);
            transition: 0.3s;
        }

        .btn-iniciar:hover {
            background: #c5a059;
            color: #1a1a1a;
        }
    </style>
</head>
<body>

    <a href="Odisseia.html" class="back-btn">⬅ Voltar</a>
    
    <div id="play-screen">
        <button class="btn-iniciar" onclick="iniciarCena()">🗡️ Presenças aterradoras</button>
    </div>

    <!-- Elemento Vídeo (com áudio habilitado) -->
    <video id="bgVideo" class="bg-video" loop playsinline>
        <source src="imagens/delegacao.mp4" type="video/mp4">
        Seu navegador não suporta o formato de vídeo.
    </video>

    <script>
        const video = document.getElementById('bgVideo');

        function iniciarCena() {
            const screen = document.getElementById('play-screen');
            
            // Garante que o som do vídeo está ativo e inicia a reprodução
            video.muted = false;
            video.play().catch(e => console.log("Erro ao tocar vídeo:", e));
            
            // Remove a tela de início
            screen.style.opacity = '0';
            setTimeout(() => {
                screen.style.display = 'none';
            }, 500);
        }
    </script>
</body>
</html>
